name: Android Build (AAB + APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Expo prebuild (generate android project)
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Show generated package id
        run: |
          echo "--- applicationId ---"
          grep -n "applicationId" android/app/build.gradle || true
          echo "--- manifest permissions ---"
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml || true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle assembleDebug (build proof)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Gradle bundleRelease (AAB)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: List outputs
        run: find android/app/build/outputs -type f -name "*.aab" -o -name "*.apk" | xargs -r ls -la

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: holdoff-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: holdoff-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
